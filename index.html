<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>تست — رصد</title>
<style>
body{font-family:Tahoma,sans-serif;background:#f1f5f9;padding:20px;direction:rtl}
#box{background:#fff;border:1px solid #ccc;border-radius:10px;padding:15px;max-width:800px;margin:auto}
.ok{color:#16a34a;font-weight:bold}
.err{color:#dc2626;font-weight:bold}
pre{background:#f8fafc;padding:10px;border-radius:6px;font-size:12px;overflow:auto;max-height:200px}
</style>
</head>
<body>
<div id="box">
  <h2>تست بارگذاری news.json</h2>
  <p id="status">در حال بارگذاری…</p>
  <pre id="log"></pre>
  <div id="list"></div>
</div>

<script>
const log = (msg, cls) => {
  const el = document.getElementById('log');
  el.textContent += msg + '\n';
};
const status = (msg, cls) => {
  const el = document.getElementById('status');
  el.textContent = msg;
  el.className = cls || '';
};

fetch('news.json?v=' + Date.now())
  .then(r => {
    log('وضعیت HTTP: ' + r.status);
    if (!r.ok) throw new Error('HTTP ' + r.status);
    return r.json();
  })
  .then(data => {
    log('count: ' + data.count);
    log('items.length: ' + (data.items ? data.items.length : 'ندارد'));
    if (!data.items || !data.items.length) {
      status('❌ فایل خوانده شد ولی خالیه (count=0)', 'err');
      return;
    }
    status('✅ ' + data.items.length + ' خبر با موفقیت خوانده شد!', 'ok');
    const list = document.getElementById('list');
    list.innerHTML = '<h3>۵ خبر اول:</h3>' + data.items.slice(0,5).map(n =>
      `<div style="border-bottom:1px solid #eee;padding:8px 0">
        <strong>${n.title || '(بی‌تیتر)'}</strong><br>
        <small style="color:#666">${n.source || ''} — ${n.published_fa || ''}</small>
      </div>`
    ).join('');
  })
  .catch(e => {
    log('خطا: ' + e.message);
    status('❌ خطا در بارگذاری: ' + e.message, 'err');
  });
</script>
</body>
</html>
