name: رصد — جمع‌آوری اخبار

on:
  schedule:
    - cron: '30 20 * * *'
    - cron: '30 8 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install deps
        run: pip install jdatetime

      - name: Run fetch_news.py
        run: python .github/scripts/fetch_news.py

      - name: Commit news.json
        run: |
          git config user.name "Rasad Bot"
          git config user.email "bot@users.noreply.github.com"
          git add news.json
          if git diff --cached --quiet; then
            echo "بدون تغییر"
          else
            git commit -m "🛰 به‌روزرسانی خودکار اخبار"
            git push
          fi
